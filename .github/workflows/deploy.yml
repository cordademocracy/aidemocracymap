name: Deploy (Cloudflare)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips instead of red-failing until the Cloudflare account is provisioned.
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun ci

      - name: Build frontend
        run: bun run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Apply D1 schema
        working-directory: worker
        run: npx wrangler d1 execute ai4democracy --remote --yes --file=schema.sql

      # `wrangler deploy` and `wrangler triggers deploy` both PATCH the script's
      # workers.dev subdomain, which this account rejects with error 10034. The
      # versions API skips that call. Consequence: routes and cron triggers are
      # NOT applied here. They are script-level config that persists across
      # version deploys, so changing `triggers` or `routes` in wrangler.jsonc
      # needs a manual apply.
      - name: Upload Worker version
        id: upload
        working-directory: worker
        run: |
          set -o pipefail
          npx wrangler versions upload 2>&1 | tee upload.log
          VERSION_ID=$(sed -r 's/\x1B\[[0-9;]*[mGKH]//g' upload.log \
            | grep -oE 'Worker Version ID: [0-9a-f-]{36}' | tail -1 | awk '{print $4}')
          test -n "$VERSION_ID" || { echo "could not parse a version id"; exit 1; }
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Promote version to 100%
        working-directory: worker
        run: npx wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100%" --yes
