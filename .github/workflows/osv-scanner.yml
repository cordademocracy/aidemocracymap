name: OSV-Scanner

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  scan-scheduled:
    permissions:
      # No SARIF upload (upload-sarif: false below) — only read access needed.
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      # bun.lock + worker/package-lock.json; --config picks up osv-scanner.toml (triaged-finding ignores)
      scan-args: |-
        --config=./osv-scanner.toml
        -r
        ./
      # SARIF upload needs GitHub Advanced Security on private repos; job failure is signal enough
      upload-sarif: false
