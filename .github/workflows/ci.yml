name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # bun >=1.2.21: audit --prod/--audit-level are silently ignored on older versions
          bun-version: "1.4.0"

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Audit production dependencies
        run: bun audit --prod --audit-level=high

      # vite build compiles messages itself; the standalone typecheck needs
      # src/paraglide (gitignored) to exist first
      - name: Compile messages
        run: bun run paraglide

      - name: Type check
        run: bunx tsc -b

      - name: Build
        run: bun run build

      # TODO(04): eslint .

  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run worker tests
        working-directory: worker
        run: npx vitest run

  org-dataset-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check layout.json ↔ org slugs
        run: node scripts/check-layout.mjs
